# Inventory of record for the maintenance scan.
#
# Everything the collectors read is declared here explicitly - there is no globbing,
# so what gets scanned is visible in one reviewable file.
# See docs/maintenance/adr/0005-no-globbing-in-file-provider.md
#
# Quote every version. YAML parses an unquoted 1.30 as the number 1.3 and loses the
# trailing zero; the schema rejects a bare number and says so.
version: 1

defaults:
    httpTimeoutMs: 15000
    httpRetries: 2
    commandTimeoutMs: 180000
    offline: false

sources:
    github:
        apiBaseUrl: https://api.github.com
        # Name of the environment variable, never the token itself.
        # Without it the GitHub API allows 60 requests an hour and findings that cannot
        # be resolved are reported as unresolved rather than as "up to date".
        tokenEnv: GITHUB_TOKEN
    npm:
        registryUrl: https://registry.npmjs.org

collectors:
    # A collector absent from this block is not configured, and the runner records it as
    # skipped.
    npm:
        enabled: true
        # package.json is authoritative for the declared set: npm outdated reports only
        # what is outdated, and its contents depend on the installed tree.
        # See docs/maintenance/adr/0001-package-json-authoritative.md
        manifest: package.json
        lockfile: package-lock.json
        runOutdated: true
        runAudit: true
        ignore: []

    githubActions:
        enabled: true
        workflows:
            - .github/workflows/ci.yml
        requireShaPins: true
        ignore: []

    images:
        enabled: true
        # Debian codenames carry no version ordering, so support dates come from a
        # committed table rather than from a registry. Re-check it against the
        # distribution's published schedule and move lastVerified when you do.
        distroCalendar:
            # Placeholder. These dates were written from general knowledge, not read off
            # each distribution's published schedule, so lastVerified records the last
            # date somebody actually checked - which is nobody, yet. Until it moves, the
            # collector reports this table as stale, which is the point: an unverified
            # calendar producing critical findings should say so about itself.
            lastVerified: '2026-01-01'
            staleAfterDays: 180
            codenames:
                buster:
                    distro: Debian
                    release: '10'
                    endOfStandardSupport: '2022-09-10'
                bullseye:
                    distro: Debian
                    release: '11'
                    endOfStandardSupport: '2026-08-31'
                bookworm:
                    distro: Debian
                    release: '12'
                    endOfStandardSupport: '2028-06-10'
                trixie:
                    distro: Debian
                    release: '13'
                    endOfStandardSupport: '2030-06-30'
                focal:
                    distro: Ubuntu
                    release: '20.04'
                    endOfStandardSupport: '2025-05-31'
                jammy:
                    distro: Ubuntu
                    release: '22.04'
                    endOfStandardSupport: '2027-06-01'
                noble:
                    distro: Ubuntu
                    release: '24.04'
                    endOfStandardSupport: '2029-06-01'
        dockerfiles:
            - path: infra/images/runner.Dockerfile
              baseImages:
                  ghcr.io/actions/actions-runner:
                      source: oci:ghcr.io/actions/actions-runner
                      tagPattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
              toolPins:
                  - id: nodejs
                    pattern: 'deb\.nodesource\.com/setup_([0-9]+)\.x'
                    source: github-release:nodejs/node
                    compare: major
                  - id: kubectl
                    pattern: 'dl\.k8s\.io/release/v([0-9][^/]*)/bin'
                    source: github-release:kubernetes/kubernetes
                    compare: minor
                  - id: helm
                    pattern: 'get\.helm\.sh/helm-v([0-9][^-]*)-linux'
                    source: github-release:helm/helm
                    compare: exact
                  - id: aws-cli
                    pattern: 'awscli-exe-linux-x86_64-([0-9][^.]*\.[^.]*\.[^"]*)\.zip'
                    source: github-release:aws/aws-cli
                    compare: exact

            - path: .devcontainer/Dockerfile
              baseImages:
                  mcr.microsoft.com/devcontainers/base:
                      source: oci:mcr.microsoft.com/devcontainers/base
                      # The registry returns thousands of tags for this repository; the
                      # ones that matter here are Debian codenames.
                      tagPattern: '^(buster|bullseye|bookworm|trixie)$'
                      distroFromCodenameSuffix: true
              toolPins:
                  - id: pulumi
                    pattern: 'get\.pulumi\.com \| sh -s -- --version ([0-9][^\s\\]*)'
                    source: github-release:pulumi/pulumi
                    compare: exact
                  - id: nodejs
                    pattern: 'deb\.nodesource\.com/setup_([0-9]+)\.x'
                    source: github-release:nodejs/node
                    compare: major

    arc:
        enabled: true
        # ARC requires the controller and every scale set to be on the same chart
        # version. A mismatch installs cleanly and fails later, so it is checked here.
        requireChartVersionParity: true
        chart:
            valuesFile: infra/arc/gha-runner-scale-set-controller.values.yaml
            versionPath: controller.chartVersion
            source: helm:ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller
        runnerScaleSet:
            valuesFile: infra/arc/gha-runner-scale-set.values.yaml
            versionPath: scaleSet.chartVersion
            source: helm:ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
        runnerImage:
            valuesFile: infra/arc/gha-runner-scale-set.values.yaml
            imagePath: scaleSet.runner.image
            source: oci:ghcr.io/actions/actions-runner
            tagPattern: '^[0-9]+\.[0-9]+\.[0-9]+$'

    eks:
        enabled: true
        inventoryFile: infra/eks/cluster.yaml
        clusterVersionPath: cluster.version
        addonsPath: cluster.addons
        # support-calendar needs no credentials and works offline. aws-cli is opt-in
        # enrichment that falls back to the calendar and records the downgrade in the
        # finding's method and confidence.
        # See docs/maintenance/adr/0002-eks-support-calendar.md
        latestStrategy: support-calendar
        # Empty on purpose. Upstream addon releases are not the same as the addon
        # versions EKS offers, and reporting drift toward a version AWS does not publish
        # is the mistake ADR-0002 rejects for the cluster version itself. Declare a
        # source here only for an addon whose upstream you have checked tracks what EKS
        # ships; until then the addons are inventoried but not compared.
        addonLatest: {}
        supportCalendar:
            # Placeholder, exactly as with the distribution calendar above: these dates
            # have not been checked against the AWS documentation, and lastVerified says
            # so. Every EKS finding rests on this table, so the collector reports the
            # table itself as stale until somebody verifies it and moves this date.
            lastVerified: '2026-01-01'
            staleAfterDays: 90
            source: https://docs.aws.amazon.com/eks/latest/userguide/kubernetes-versions.html
            defaultVersion: '1.34'
            versions:
                - version: '1.31'
                  releasedAt: '2024-09-26'
                  endOfStandardSupport: '2025-11-26'
                  endOfExtendedSupport: '2026-11-26'
                  status: extended-support
                - version: '1.32'
                  releasedAt: '2025-01-23'
                  endOfStandardSupport: '2026-03-23'
                  endOfExtendedSupport: '2027-03-23'
                  status: extended-support
                - version: '1.33'
                  releasedAt: '2025-05-28'
                  endOfStandardSupport: '2026-07-31'
                  endOfExtendedSupport: '2027-07-31'
                  status: extended-support
                - version: '1.34'
                  releasedAt: '2025-09-26'
                  endOfStandardSupport: '2026-11-26'
                  endOfExtendedSupport: '2027-11-26'
                  status: standard-support
                - version: '1.35'
                  releasedAt: '2026-01-22'
                  endOfStandardSupport: '2027-03-23'
                  endOfExtendedSupport: '2028-03-23'
                  status: standard-support

severity:
    # Every override needs a reason and an expiry. An expired override is ignored and
    # raises a config-stale finding naming itself.
    overrides: []
